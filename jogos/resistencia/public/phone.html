<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Resistência · Controle</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="phone-body">
  <div class="phone">
    <header class="phone-header">
      <span class="logo tiny"><span class="logo-x" aria-hidden="true">X</span><span class="logo-word">Resistência</span></span>
      <span class="header-right">
        <button class="sound-toggle" id="phone-sound" type="button" aria-label="Som do celular">🔔</button>
        <span class="code-chip">sala <strong id="room-code">…</strong></span>
      </span>
    </header>

    <section class="screen center-screen" id="screen-loading">
      <p>Conectando à sala…</p>
    </section>

    <!-- Entrar na sala: nome e ficha (cor). A carta de personagem vem na partida. -->
    <form class="screen hidden" id="screen-join" autocomplete="off">
      <h1>Junte-se à Resistência</h1>
      <p class="lead">Escolha seu nome e a sua ficha. Na partida, cada um recebe uma carta de personagem.</p>
      <div class="field">
        <label for="name-input">Seu nome</label>
        <input id="name-input" name="name" maxlength="14" placeholder="Ex.: Bruno" enterkeyhint="done" required>
      </div>
      <div class="field">
        <label id="colors-label">Sua ficha</label>
        <div class="colors" id="colors" role="group" aria-labelledby="colors-label"></div>
      </div>
      <p class="form-error hidden" id="join-error" role="alert"></p>
      <div class="actions">
        <button class="btn" id="join-button" type="submit" disabled>Entrar na sala</button>
      </div>
    </form>

    <!-- Dentro da sala -->
    <section class="screen hidden" id="screen-room">
      <div class="panel me-card" id="me-card"></div>
      <button class="btn" id="ready-button" type="button">Estou pronto!</button>
      <div class="panel leader-box hidden" id="leader-box">
        <button class="btn" id="start-button" type="button" disabled>Começar partida</button>
        <p id="leader-hint"></p>
        <button class="btn secondary tv-sound-button" type="button">🔊 Som da TV: ligado</button>
      </div>
      <p class="waiting-leader hidden" id="waiting-leader"></p>
      <div class="others">
        <h2 id="others-title">Na sala</h2>
        <ul id="others-list"></ul>
      </div>
      <div class="actions">
        <button class="link-button" id="leave-button" type="button">Sair da sala</button>
      </div>
    </section>

    <!-- Partida -->
    <section class="screen hidden" id="screen-game">
      <div class="turn-banner" id="turn-banner"></div>

      <!-- A sua carta de personagem (pública, está na TV). Enquanto o dedo segura,
           ela vira e mostra o papel no verso — solta, volta. A frente é igual em
           jeito para todos; ninguém do lado vê o papel. -->
      <div class="role-zone">
        <button class="role-card" id="role-card" type="button" aria-label="Segure para ver o seu papel">
          <span class="rc-inner">
            <span class="rc-face rc-front">
              <img class="rc-img" id="my-card" alt="">
              <span class="rc-hint">🔒 Segure para ver seu papel</span>
            </span>
            <span class="rc-face rc-back" id="role-shown"></span>
          </span>
        </button>
      </div>

      <p class="tab-help" id="tab-help"></p>

      <div class="hidden" id="roles-box">
        <button class="btn" id="seen-button" type="button">Já vi meu papel</button>
      </div>

      <div class="hidden" id="pick-box">
        <ul class="pick-list" id="pick-list"></ul>
        <button class="btn" id="propose-button" type="button">Mandar para votação</button>
      </div>

      <div class="choice-row hidden" id="vote-box">
        <button class="vote-coin yes" id="vote-yes" type="button"><span class="coin-face">👍</span><span class="coin-word">Aprovo</span></button>
        <button class="vote-coin no" id="vote-no" type="button"><span class="coin-face">👎</span><span class="coin-word">Recuso</span></button>
      </div>

      <!-- As duas cartas aparecem iguais para todos (Resistência e espiões) e,
           depois do toque, as duas viram e somem do mesmo jeito. -->
      <div class="choice-row mission-box hidden" id="mission-box">
        <button class="m-choice success" id="mission-success" type="button">
          <span class="mc-inner"><span class="mc-face mc-front"><span class="mc-mark">✓</span><span class="mc-word">Sucesso</span></span><span class="mc-face mc-back"><span class="back-x">X</span></span></span>
        </button>
        <button class="m-choice sabotage" id="mission-sabotage" type="button">
          <span class="mc-inner"><span class="mc-face mc-front"><span class="mc-mark">✗</span><span class="mc-word">Sabotar</span></span><span class="mc-face mc-back"><span class="back-x">X</span></span></span>
        </button>
      </div>

      <div class="panel over-box hidden" id="over-box">
        <ul class="role-list" id="role-list"></ul>
        <button class="btn hidden" id="rematch-button" type="button">Jogar de novo (mesmas pessoas)</button>
      </div>

      <div class="missions-mini" id="missions-mini"></div>

      <div class="actions">
        <button class="btn secondary hidden" id="skip-button" type="button">Pular quem está desconectado</button>
        <button class="btn secondary tv-sound-button hidden" id="game-tv-sound" type="button">🔊 Som da TV: ligado</button>
        <button class="link-button hidden" id="end-game-button" type="button">Encerrar partida (líder)</button>
      </div>
    </section>

    <!-- Mensagens (sala não existe, cheia, removido...) -->
    <section class="screen center-screen hidden" id="screen-message">
      <h1 id="message-title"></h1>
      <p id="message-text"></p>
      <button class="btn secondary" id="message-button" type="button">Tentar de novo</button>
    </section>
  </div>

  <div class="toast hidden" id="toast" role="status"></div>
  <div class="conn-banner hidden" id="conn-banner">Reconectando…</div>

  <script type="module" src="/phone.js"></script>
</body>
</html>
