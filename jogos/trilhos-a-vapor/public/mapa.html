<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trilhos a Vapor · Mapa</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    #map-wrap { width: min(100%, 1600px); }

</head>
<body>
  <!-- Página só para ver o mapa (útil para ajustar o desenho). -->
  <div id="map-wrap"></div>
  <script type="module">
    import { createMap } from '/map-view.js';
    document.getElementById('map-wrap').append(createMap());
  </script>
</body>
</html>
